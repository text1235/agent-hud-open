<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>协作工作台 · Codex</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#1b2925;background:#f5f6f2;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid #dfe5dd;background:#fbfcf9}.brand{font-weight:750;font-size:19px}.brand b{display:inline-grid;place-items:center;background:#1e5947;color:white;width:32px;height:32px;border-radius:9px;margin-right:12px}.tag{font-size:12px;padding:5px 10px;border:1px solid #d9e3d9;border-radius:20px;color:#527561}.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 76px)}aside{padding:28px 20px;background:#eef1e9;border-right:1px solid #dfe5dd}.label{color:#748175;font-size:11px;letter-spacing:1.5px;font-weight:bold;text-transform:uppercase}.nav{padding:13px 14px;border-radius:8px;margin-top:8px;font-weight:600;background:#dce8dc;color:#285942}#projects{margin-top:20px}.project{padding:12px 10px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:8px;cursor:pointer;color:#617166}.project.active{background:white;color:#235440}.aside-note{margin-top:45px;font-size:12px;line-height:1.9;color:#718071}main{padding:34px 40px;max-width:1550px;width:100%}.heading{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;letter-spacing:-1px;margin:0 0 8px}p{color:#728075;line-height:1.7;margin:0}.primary{border:0;border-radius:8px;padding:12px 19px;background:#245e49;color:white;font-weight:600}.secondary{background:white;border:1px solid #dce3d8;border-radius:7px;padding:8px 12px;color:#425d4a}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:28px 0}.card{border:1px solid #dfe5db;background:#fff;border-radius:12px;padding:22px}.card-head{display:flex;justify-content:space-between;align-items:center}.icon{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#e6efe3;font-size:19px}.card h3{margin:17px 0 6px;font-size:17px}.card small{color:#7c897d}.status{font-size:11px;color:#4c7960;background:#eff5ed;border-radius:20px;padding:5px 8px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:31px 0 14px}h2{font-size:17px;margin:0}.layout{display:grid;grid-template-columns:minmax(320px,1.15fr) minmax(320px,1fr);gap:18px}.panel{background:white;border:1px solid #dfe5db;border-radius:12px;min-height:320px;overflow:hidden}.panel-title{padding:17px 20px;border-bottom:1px solid #e9ede5;display:flex;justify-content:space-between}.task{padding:18px 20px;border-bottom:1px solid #eef1ea;cursor:pointer}.task:hover,.task.selected{background:#f4f8f0}.task-title{font-weight:600;line-height:1.6;overflow-wrap:anywhere}.meta{color:#819082;font-size:11px;display:flex;gap:10px;margin-top:10px}.pill{border-radius:4px;padding:2px 6px;background:#edf0e9;color:#65765f}.empty{padding:65px 25px;text-align:center;color:#879286;line-height:2}.detail{padding:20px}.detail h3{margin:0 0 12px;font-size:16px;line-height:1.6}.detail label{font-size:11px;color:#849180;display:block;margin:18px 0 8px}.result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;background:#f6f8f2;padding:14px;border-radius:7px;font-size:12px;max-height:350px;overflow:auto}.event{border-left:2px solid #d7e4cf;padding:4px 0 10px 13px;font-size:12px;color:#657761;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#a43a2f;background:#fff0ec;padding:12px;border-radius:8px;margin:15px 0;display:none}footer{font-size:11px;color:#8a9588;margin-top:25px}dialog{border:1px solid #dce3d7;border-radius:15px;width:min(580px,92vw);padding:28px}dialog::backdrop{background:#13281b55}dialog h2{font-size:21px;margin-bottom:20px}form label{display:block;font-size:12px;font-weight:600;margin:15px 0 7px}input,select,textarea{width:100%;border:1px solid #d9e1d4;border-radius:7px;background:#fafcf8;padding:10px;color:#2e4533}textarea{resize:vertical;min-height:75px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.shell{grid-template-columns:180px 1fr}main{padding:25px}.card{padding:16px}}@media(max-width:640px){aside{display:none}.shell{display:block}header{padding:0 20px}main{padding:24px 16px}.cards{gap:8px}.card{padding:12px}.card h3{font-size:13px}.card small{font-size:10px}.card-head{display:block}.status{display:inline-block;margin-top:8px}.heading{align-items:flex-start}h1{font-size:23px}.heading p{font-size:12px;max-width:210px}.primary{padding:11px 13px}}
</style>
<header><div class="brand"><b>✳</b>协作工作台</div><div class="tag">● 本机运行 · 未开放公网</div></header>
<div class="shell"><aside><div class="label">Workspace</div><div class="nav">▦　任务总览</div><div class="label" style="margin-top:35px">项目目录</div><div id="projects"></div><div class="aside-note">Codex 负责派工与验收<br>两个帮手负责实际执行<br><br>任务完成 ≠ 验收通过<br>以真实文件与检查结果为准</div></aside>
<main><div class="heading"><div><div class="label" style="margin-bottom:10px">Your agent team</div><h1>一起把事情做完。</h1><p>一个工作台，查看项目、执行动态和交付结果。</p></div><button class="primary" id="new">＋ 新建任务</button></div>
<div id="error" class="error" role="alert"></div><div class="cards" id="cards"></div><div class="sectionhead"><h2>任务与交付 <span id="count" style="color:#8a9783;font-size:13px"></span></h2><button class="secondary" id="refresh">↻ 刷新</button></div>
<div class="layout"><section class="panel"><div class="panel-title"><b>任务列表</b><span class="label">最近 100 条 / 执行端</span></div><div id="tasks"></div></section><section class="panel"><div class="panel-title"><b>执行详情</b><span class="label">实际状态</span></div><div id="detail" class="empty">选择一个任务<br>查看结果、验收状态和执行动态</div></section></div><footer id="updated">正在连接本机 Gateway…</footer></main></div>
<dialog id="modal"><form id="form"><h2>交给帮手执行</h2><div class="formrow"><div><label for="executor">执行端</label><select id="executor"><option value="hermes">大肥鱼 · Hermes</option><option value="antigravity">Antigravity · 按额度选择</option></select></div><div><label for="model">Antigravity 模型（auto 自动选，≤10% 切换）</label><input id="model" value="auto"></div></div><label for="workspace">项目绝对目录</label><input id="workspace" required placeholder="Z:\项目文件夹"><label for="objective">要完成什么</label><textarea id="objective" required placeholder="描述具体成果"></textarea><label for="boundary">允许操作的范围</label><textarea id="boundary" required>仅限所选项目，不读取密钥，不发送外部消息，不强制结束进程，不转委托。</textarea><label for="acceptance">怎样算完成</label><textarea id="acceptance" required placeholder="可检查的文件、行为或测试结果"></textarea><div id="formerror" class="error"></div><p style="font-size:11px;margin-top:16px">提交会真实执行任务。此处发起的任务保存在工作台；如需 Codex 自动验收，请在 Codex 聊天中派工。</p><div class="actions"><button type="button" class="secondary" id="cancel">取消</button><button class="primary" id="submit">提交任务</button></div></form></dialog>
<script>
const TOKEN='__ACCESS_TOKEN__', $=id=>document.getElementById(id);let state=null,selected=null,filter=null,loading=false,requestKey=null;
const labels={queued:'排队中',submitting:'派工中',running:'执行中',waiting_approval:'请到桌面确认',completed:'已交付',failed:'执行失败',uncertain:'待确认',cancelled:'已取消',pending:'待验收',accepted:'验收通过',rejected:'需返工'};
function el(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
async function api(name,args={}){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify({name,arguments:args})});let d=await r.json();if(d.error)throw Error(d.error);return d.result}
function report(e){$('error').textContent=e.message;$('error').style.display='block'}
function render(){
 $('cards').replaceChildren(...state.executors.map((x,i)=>{let c=el('div',undefined,'card'),h=el('div',undefined,'card-head');h.append(el('div',['✳','🐟','✦'][i],'icon'),el('span',x.state,'status'));c.append(h,el('h3',x.name),el('small',x.role));return c}));
 let projects=$('projects');projects.replaceChildren();let all=el('div','所有项目','project'+(!filter?' active':''));all.onclick=()=>{filter=null;render()};projects.append(all);for(let p of state.projects){let e=el('div',p.path.split(/[\\/]/).filter(Boolean).pop(),'project'+(filter===p.id?' active':''));e.title=p.path;e.onclick=()=>{filter=p.id;render()};projects.append(e)}
 let tasks=state.tasks.filter(t=>!filter||t.project===filter||(t.project_root||t.workspace)?.toLowerCase()===state.projects.find(p=>p.id===filter)?.path?.toLowerCase());$('count').textContent='· '+tasks.length;
 $('tasks').replaceChildren(...tasks.map(t=>{let e=el('div',undefined,'task'+(selected?.id===t.id?' selected':''));e.append(el('div',t.objective,'task-title'));let m=el('div',undefined,'meta');m.append(el('span',t.executor==='hermes'?'🐟 大肥鱼':'✦ Antigravity'),el('span',labels[t.status]||t.status,'pill'),el('span',labels[t.review]||'待验收','pill'),el('span',new Date(t.created*1000).toLocaleString('zh-CN')));e.append(m);e.onclick=()=>{selected=t;render();detail().catch(report)};return e}));if(!tasks.length)$('tasks').append(el('div','暂无任务。点击“新建任务”开始。','empty'));
}
async function detail(){if(!selected)return;const picked=selected;let t=await api('task',{executor:picked.executor,task_id:picked.id});if(selected?.id!==picked.id)return;let box=$('detail');box.className='detail';box.replaceChildren(el('h3',t.objective),el('p',(labels[t.status]||t.status)+' · '+(labels[t.review]||'待验收')));if(t.transport==='antigravity-desktop'){box.append(el('label','Antigravity 桌面任务'),el('div','所属项目：'+t.project_root+'\n办公区：'+t.workspace+'\n桌面会话：'+t.conversation_id+'\n模型：'+t.model,'result'))}box.append(el('label','交付结果'),el('div',t.result||'尚未收到最终交付。','result'));if(t.execution){box.append(el('label','执行证据'),el('div',JSON.stringify(t.execution,null,2),'result'))}box.append(el('label','执行动态'));for(let e of t.events||[]){box.append(el('div',new Date(e.created*1000).toLocaleTimeString('zh-CN')+' · '+e.kind+'\n'+(e.detail||e.text||''),'event'))}}
async function refresh(){if(loading)return;loading=true;try{state=await api('state');render();await detail();$('error').style.display='none';$('updated').textContent='最近同步 '+new Date().toLocaleTimeString('zh-CN')+' · 每 5 秒读取本机状态，不调用模型。'}catch(e){report(e)}finally{loading=false}}
$('new').onclick=()=>{requestKey=crypto.randomUUID();const project=state?.projects.find(p=>p.id===filter);$('workspace').value=project?.path||'';$('modal').showModal()};$('cancel').onclick=()=>$('modal').close();$('refresh').onclick=refresh;
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{const a={request_key:requestKey};for(let k of ['executor','model','workspace','objective','boundary','acceptance'])a[k]=$(k).value;let t=await api('submit',a);selected={...t,executor:a.executor};$('modal').close();await refresh()}catch(err){$('formerror').textContent=err.message;$('formerror').style.display='block'}finally{$('submit').disabled=false}};refresh();setInterval(refresh,5000);
</script></html>
