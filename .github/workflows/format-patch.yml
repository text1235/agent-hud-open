name: Source formatting patch
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-*']
    paths: ['.github/workflows/format-patch.yml']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: git diff --binary > formatting.patch
      - uses: actions/upload-artifact@v4
        with:
          name: source-formatting-patch
          path: formatting.patch
          retention-days: 3
